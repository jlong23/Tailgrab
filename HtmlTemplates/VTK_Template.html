
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .content-block {
    display: flex;
    flex-direction: column;
    background-color: #333333;
    border-radius: 10px;
    padding: 20px;
    color: white;
    font-family: Arial, sans-serif;
    width: fit-content;
    max-width: 100%;
  }

  .content-block .header {
    width: 100%;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 10px;
  }

  .content-block .row {
    display: flex;
    align-items: flex-start;
  }

  .thumbnail-space {
    width: 400px;
    height: 300px;
    margin-right: 20px;
    background-color: #555555;
    flex-shrink: 0;
  }

  .text-content {
    flex-grow: 1;
    font-size: 14px;
    line-height: 1.6;
  }

  .text-content dt {
    font-weight: bold;
    color: #ccc;
  }
</style>
</head>
<body>

<div class="content-block">
  <div class="header">VOTE TO KICK INITIATED AGAINST</div>

  <div class="row">
    <div class="thumbnail-space">
      <img src="{thumbnailUrl}" alt="Thumbnail" style="width:100%; height:100%; object-fit:cover; border-radius: 5px;">
    </div>

    <div class="text-content">
        {content}
    </div>
  </div>
</div>
</body>
</html>
